data:
  train_files: <PTD_ROOT>/datasets/train_with_hint.jsonl
  val_files: <PTD_ROOT>/datasets/mmk12_val.jsonl
  prompt_key: problem
  answer_key: answer
  image_key: images
  video_key: videos
  image_dir: null
  video_fps: 2.0
  max_prompt_length: 8192
  max_response_length: 4096
  rollout_batch_size: 384
  mini_rollout_batch_size: 128
  val_batch_size: 1024
  format_prompt: <PTD_ROOT>/source/examples/format_prompt/math_perception.jinja
  override_chat_template: null
  shuffle: true
  seed: 1
  min_pixels: 200704
  max_pixels: 1003520
  filter_overlong_prompts: true
  filter_overlong_prompts_workers: 16
  prompt_with_hint_key: prompt_with_hint
  max_hint_prompt_length: 4096
  hint_format_prompt: null
worker:
  hybrid_engine: true
  actor:
    strategy: fsdp
    global_batch_size: 128
    micro_batch_size_per_device_for_update: 2
    micro_batch_size_per_device_for_experience: 4
    max_grad_norm: 1.0
    clip_ratio_low: 0.2
    clip_ratio_high: 0.3
    clip_ratio_dual: 3.0
    loss_avg_mode: token
    loss_type: default
    ppo_epochs: 1
    padding_free: true
    dynamic_batching: true
    ulysses_size: 1
    use_torch_compile: true
    tau_positive: 1.0
    tau_negative: 1.05
    model:
      model_path: <PTD_MODEL_PATH>
      tokenizer_path: <PTD_MODEL_PATH>
      override_config: {}
      enable_gradient_checkpointing: true
      trust_remote_code: false
      freeze_vision_tower: false
      lora:
        rank: 0
        alpha: 64
        target_modules: all-linear
        exclude_modules: .*visual.*
    optim:
      lr: 1.0e-06
      betas:
      - 0.9
      - 0.999
      weight_decay: 0.01
      strategy: adamw_bf16
      lr_warmup_ratio: 0.0
      lr_warmup_steps: null
      min_lr_ratio: null
      lr_scheduler_type: constant
      training_steps: -1
    fsdp:
      enable_full_shard: true
      enable_cpu_offload: false
      enable_rank0_init: true
      use_orig_params: false
      torch_dtype: bf16
      fsdp_size: -1
      mp_param_dtype: bf16
      mp_reduce_dtype: fp32
      mp_buffer_dtype: fp32
    offload:
      offload_params: true
      offload_optimizer: true
    global_batch_size_per_device: -1
    disable_kl: false
    use_kl_loss: true
    kl_penalty: low_var_kl
    kl_coef: 0.01
    kl_direction: forward_kl
    enable_ptd: true
    ptd_coef: 0.5
    ptd_top_k: 100
    ptd_kl_penalty: low_var_kl
    ptd_kl_direction: jsd_kl
    use_ori_entropy_loss: false
    ori_entropy_loss_coef: 0.0
    enable_opsd: false
    opsd_coef: 1.0
  critic:
    strategy: fsdp
    global_batch_size: 256
    micro_batch_size_per_device_for_update: 4
    micro_batch_size_per_device_for_experience: 16
    max_grad_norm: 1.0
    cliprange_value: 0.5
    loss_avg_mode: token
    ppo_epochs: 1
    padding_free: false
    dynamic_batching: true
    ulysses_size: 1
    model:
      model_path: null
      tokenizer_path: null
      override_config: {}
      enable_gradient_checkpointing: true
      trust_remote_code: true
      freeze_vision_tower: false
      lora:
        rank: 0
        alpha: 64
        target_modules: all-linear
        exclude_modules: null
    optim:
      lr: 1.0e-06
      betas:
      - 0.9
      - 0.999
      weight_decay: 0.01
      strategy: adamw
      lr_warmup_ratio: 0.0
      lr_warmup_steps: null
      min_lr_ratio: null
      lr_scheduler_type: constant
      training_steps: -1
    fsdp:
      enable_full_shard: true
      enable_cpu_offload: false
      enable_rank0_init: true
      use_orig_params: false
      torch_dtype: null
      fsdp_size: -1
      mp_param_dtype: bf16
      mp_reduce_dtype: fp32
      mp_buffer_dtype: fp32
    offload:
      offload_params: false
      offload_optimizer: false
    global_batch_size_per_device: -1
  ref:
    strategy: fsdp
    fsdp:
      enable_full_shard: true
      enable_cpu_offload: false
      enable_rank0_init: true
      use_orig_params: false
      torch_dtype: bf16
      fsdp_size: -1
      mp_param_dtype: bf16
      mp_reduce_dtype: fp32
      mp_buffer_dtype: fp32
    offload:
      offload_params: false
      offload_optimizer: false
    micro_batch_size_per_device_for_experience: 4
    padding_free: true
    dynamic_batching: true
    ulysses_size: 1
    use_torch_compile: true
    ptd_top_k: 100
  reward:
    reward_function: <PTD_ROOT>/source/examples/reward_function/qwen3_vl_think.py
    reward_function_kwargs: {}
    skip_special_tokens: true
    num_cpus: 1
    reward_function_name: compute_score
  rollout:
    name: vllm
    'n': 8
    temperature: 1.0
    top_p: 0.99
    top_k: -1
    seed: 1
    limit_images: 0
    dtype: bf16
    gpu_memory_utilization: 0.6
    ignore_eos: false
    enforce_eager: false
    enable_chunked_prefill: false
    tensor_parallel_size: 1
    max_model_len: null
    max_num_batched_tokens: 16384
    disable_log_stats: true
    disable_tqdm: false
    val_override_config:
      temperature: 1.0
      top_p: 1.0
      'n': 8
    prompt_length: 8192
    response_length: 4096
    trust_remote_code: false
algorithm:
  gamma: 1.0
  lam: 1.0
  adv_estimator: grpo
  disable_kl: false
  use_kl_loss: true
  kl_penalty: low_var_kl
  kl_coef: 0.01
  kl_type: fixed
  kl_horizon: 10000.0
  kl_target: 0.1
  online_filtering: false
  filter_key: accuracy
  filter_low: 0.01
  filter_high: 0.99
  kl_direction: forward_kl
  enable_ptd: true
  ptd_threshold: 1.0
  ptd_coef: 0.5
  ptd_top_k: 100
  ptd_kl_penalty: low_var_kl
  ptd_kl_direction: jsd_kl
  ptd_all_trajectories: false
  ptd_use_ref_teacher: true
  use_ori_entropy_loss: false
  ori_entropy_loss_coef: 0.0
  enable_opsd: false
  opsd_coef: 1.0
trainer:
  total_epochs: 2
  max_steps: null
  project_name: ptd3vl4b-reproduction
  experiment_name: qwen3_vl_4b_thinking_ViRL39K_ref_ptd-grpo_jsd_top100_5e-1_thr_1_rollout_8_max_token_4096
  logger:
  - console
  - file
  - swanlab
  nnodes: 1
  n_gpus_per_node: 8
  max_try_make_batch: 20
  critic_warmup: 0
  val_freq: 40
  val_before_train: false
  val_only: false
  val_generations_to_log: 5
  save_freq: 40
  save_limit: 5
  save_model_only: false
  save_checkpoint_path: <PTD_ROOT>/checkpoints
  load_checkpoint_path: null
  ray_timeline: null
  find_last_checkpoint: false
  save_group_stats: false
